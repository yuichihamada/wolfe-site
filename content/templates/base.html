<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}REBIRTH Connect{% endblock %}</title>
  <meta name="description" content="REBIRTH 教育・研修サイト">
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
  <style>
    /* ─── Base ─── */
    body {
      font-family: 'Noto Sans JP', sans-serif;
      font-feature-settings: "palt";
    }

    /* ─── Animations ─── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade-up {
      animation: fadeUp 0.5s cubic-bezier(0.4,0,0.2,1) both;
    }
    .reveal {
      opacity: 0;
      transform: translateX(-10px);
      transition: opacity 0.45s cubic-bezier(0.4,0,0.2,1),
                  transform 0.45s cubic-bezier(0.4,0,0.2,1);
    }
    .reveal.visible {
      opacity: 1;
      transform: translateX(0);
    }

    @media (min-width: 768px) {
      article.prose p:has(> img + img) {
        display: grid;
        grid-template-columns: repeat(auto-fit, 240px);
        gap: 8px;               /* ← 隙間を詰める（重要） */
        justify-content: center; /* 全体を中央寄せ */
        margin: 1.25rem 0;
      }
      article.prose p:has(> img + img) > img {
        width: auto;        /* ← 拡大させない */
        max-width: 240px;   /* 表示サイズ固定 */
        height: auto;
        display: block;
        margin: 0;
        border-radius: 10px;
      }
    }
    @media (max-width: 767px) {
      article.prose p > img {
        display: block;
        margin: 0.75rem auto; /* 上下余白＋中央寄せ */
        max-width: 92%;       /* 画面いっぱいにしすぎない */
        height: auto;
      }
    }
    .prose img {
      margin-left: auto;
      margin-right: auto;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col bg-gray-50">
  <header class="bg-white border-b">
    <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between relative">
      <a href="/" class="font-semibold text-lg">REBIRTH Connect</a>

      <!-- PCナビ -->
      <nav class="hidden md:flex gap-4 text-sm ml-auto items-center">
        <a href="/mission/" class="hover:underline tracking-wide">REBIRTHとは</a>
        <a href="/roadmap/" class="hover:underline tracking-wide">ロードマップ</a>
        <a href="/training/" class="hover:underline tracking-wide">研修動画</a>
        <a href="/calendar/" class="hover:underline tracking-wide">スケジュール</a>
      </nav>

      <!-- ▼ ハンバーガー -->
      <button id="menuBtn"
              class="md:hidden inline-flex items-center justify-center w-10 h-10 rounded-lg text-gray-700 ml-auto hover:bg-gray-100 transition-colors"
              aria-controls="mobileNav" aria-expanded="false" aria-label="メニューを開閉">
        <svg id="iconOpen" class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M4 6h16M4 12h16M4 18h16" />
        </svg>
        <svg id="iconClose" class="h-6 w-6 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>


      <!-- ▼ モバイルナビ -->
      <div id="mobileNav"
          class="md:hidden absolute left-0 right-0 top-full z-50
                  bg-white border-t shadow
                  overflow-hidden origin-top transform-gpu
                  max-h-0 opacity-0 -translate-y-2 pointer-events-none
                  transition-all duration-200 ease-out">

        <nav class="flex flex-col text-sm p-4 space-y-1">
          <a href="/mission/" class="block py-2">REBIRTHとは</a>
          <a href="/roadmap/" class="block py-2">ロードマップ</a>
          <a href="/training/" class="block py-2">研修動画</a>
          <a href="/calendar/" class="block py-2">スケジュール</a>
        </nav>
      </div>
    </div>
  </header>

  <main class="flex-1">{% block content %}{% endblock %}</main>

  <footer class="bg-gray-100 text-center text-xs py-6 text-gray-600">
    © {{ now|default:"" }} REBIRTH Connect. All rights reserved.
  </footer>
  
  <script>
    /* --- モバイル メインメニューの制御 --- */
    (function () {
      const btn = document.getElementById('menuBtn');
      const panel = document.getElementById('mobileNav');
      const iconOpen = document.getElementById('iconOpen');
      const iconClose = document.getElementById('iconClose');

      function openPanel() {
        btn.setAttribute('aria-expanded', 'true');
        panel.classList.remove('max-h-0','opacity-0','-translate-y-2','pointer-events-none');
        panel.classList.add('max-h-[75vh]','opacity-100','translate-y-0','pointer-events-auto');
        iconOpen.classList.add('hidden'); iconClose.classList.remove('hidden');
      }
      function closePanel() {
        btn.setAttribute('aria-expanded', 'false');
        panel.classList.add('max-h-0','opacity-0','-translate-y-2','pointer-events-none');
        panel.classList.remove('max-h-[75vh]','opacity-100','translate-y-0','pointer-events-auto');
        iconOpen.classList.remove('hidden'); iconClose.classList.add('hidden');
      }

      btn?.addEventListener('click', () => {
        const expanded = btn.getAttribute('aria-expanded') === 'true';
        expanded ? closePanel() : openPanel();
      });

      const mq = window.matchMedia('(min-width: 768px)');
      function sync(e){ if (e.matches) closePanel(); }
      sync(mq);
      mq.addEventListener('change', sync);
    })();
  </script>

  <script>
    /* ─── Scroll Reveal ─── */
    (function(){
      const observer = new IntersectionObserver(entries => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('visible');
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.08 });
      document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
    })();
  </script>
</body>
</html>
