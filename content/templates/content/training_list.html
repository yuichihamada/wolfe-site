{% extends 'base.html' %}
{% block title %}研修動画一覧 - REBIRTH Connect{% endblock %}
{% block content %}
<section class="max-w-6xl mx-auto px-4 py-12">
  <div class="mb-6">
    <h2 class="text-2xl font-semibold mb-4">研修動画一覧</h2>
    <div class="flex flex-wrap gap-2">
      <a href="?"
         class="px-4 py-1.5 rounded-full border text-sm transition
                {% if not current %}bg-black text-white border-black{% else %}text-gray-600 border-gray-300 hover:border-gray-500{% endif %}">
        すべて
      </a>
      {% for c in categories %}
        <a href="?category={{ c.slug }}"
           class="px-4 py-1.5 rounded-full border text-sm transition
                  {% if current == c.slug %}bg-black text-white border-black{% else %}text-gray-600 border-gray-300 hover:border-gray-500{% endif %}">
          {{ c.name }}
        </a>
      {% endfor %}
    </div>
  </div>

  <div class="grid md:grid-cols-3 gap-6">
    {% for v in videos %}
      <article class="bg-white border rounded-xl p-4">
        <div class="aspect-video mb-3">
          <iframe class="w-full h-full" src="{{ v.embed_src }}" title="{{ v.title }}"
          frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        </div>
        <h3 class="font-semibold mb-1">{{ v.title }}</h3>
        <p class="text-sm text-gray-600">{{ v.description|truncatechars:90 }}</p>
      </article>
    {% empty %}
      <p>動画は準備中です。</p>
    {% endfor %}
  </div>
</section>
{% endblock %}
